<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d10">
  <title>GTA 6 CLIPFORGE — Turn Gameplay Into Highlights.</title>
  <meta name="description" content="GTA 6 ClipForge: browser-based highlight detection, hook intelligence and vertical short-form export for gameplay you own or are authorized to republish.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar" data-tip="Collapse / expand menu">
      <svg class="ic"><use href="assets/icons/sprite.svg#i-menu"/></svg>
    </button>
    <a class="brand" href="#/dashboard" aria-label="GTA 6 ClipForge home">
      <img src="assets/logo.svg" alt="" width="30" height="30">
      <span class="brand-text"><b>GTA 6</b> CLIPFORGE</span>
    </a>

    <div class="topbar-center">
      <label class="project-picker" data-tip="Current project">
        <span class="pp-label">Project</span>
        <select id="project-select" aria-label="Current project"></select>
      </label>
    </div>

    <div class="topbar-right">
      <button class="status-chip" id="processing-chip" data-tip="Processing status">
        <span class="dot" id="processing-dot"></span>
        <span id="processing-text">Idle</span>
        <span class="chip-progress" id="processing-bar"><i></i></span>
      </button>
      <button class="status-chip" id="ffmpeg-chip" data-tip="FFmpeg.wasm status (loads on first MP4 export)">
        <svg class="ic sm"><use href="assets/icons/sprite.svg#i-cpu"/></svg>
        <span id="ffmpeg-text">FFmpeg: idle</span>
      </button>
      <button class="status-chip" id="storage-chip" data-tip="Browser storage used by ClipForge">
        <svg class="ic sm"><use href="assets/icons/sprite.svg#i-db"/></svg>
        <span id="storage-text">Storage…</span>
      </button>
      <a class="icon-btn" href="#/settings" aria-label="Settings" data-tip="Settings">
        <svg class="ic"><use href="assets/icons/sprite.svg#i-settings"/></svg>
      </a>
      <button class="icon-btn" id="help-btn" aria-label="Help" data-tip="Help &amp; workflow">
        <svg class="ic"><use href="assets/icons/sprite.svg#i-help"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>
    <main class="main" id="main" tabindex="-1">
      <noscript><div class="card pad">ClipForge needs JavaScript (ES modules) to run.</div></noscript>
      <div id="view"></div>
    </main>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <div class="modal-host" id="modal-host"></div>
  <div class="tip" id="tip" role="tooltip"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
